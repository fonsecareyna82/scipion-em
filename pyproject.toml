[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scipion-em"
dynamic = ["version", "dependencies"]

authors = [
    {name = "Pablo Conesa", email = "pconesa@cnb.csic.es"},
    {name = "Yunior Fonseca", email = "cfonseca@cnb.csic.es"},
    {name = "J.M. De la Rosa Trevin", email = "josemiguel.delarosatrevin@stjude.org"},
    {name = "Roberto Marabini", email = "roberto@cnb.csic.es"},
    {name = "Grigory Sharov", email = "sharov.grigory@gmail.com"},
    {name = "Josue Gomez Blanco", email = "josue.gomez-blanco@mcgill.ca"},
]
description = "Plugin extends Scipion framework towards cryo EM image processing"
readme = "README.rst"
requires-python = ">=3.8"
keywords = ["scipion", "electron-microscopy", "cryo-em", "structural-biology", "image-processing", "scipion-3.0"]
license = {text = "GNU General Public License v3 (GPLv3)"}

[project.urls]
Homepage = "https://github.com/scipion-em/scipion-em"
Repository = "https://github.com/scipion-em/scipion-em"
Issues = "https://github.com/scipion-em/scipion-em/issues"

[tool.setuptools.package-data]
"pwem" = ["protocols.conf", "scipion_icon.png", "templates/*", "cmd/*"]

[project.entry-points."pyworkflow.plugin"]
pwem = "pwem"

[project.scripts]
emprogram = 'pwem.cmd.program:main'
emchimera = 'pwem.cmd.chimera_client:main'
emconvert = 'pwem.cmd.convert:main'


[tool.setuptools.dynamic]
version = {attr = "pwem.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["pwem*", "software*"]

[tool.pytest.ini_options]
testpaths = ["pwem/tests"]
addopts = [
    # scipion-em-xmipp is a separate, heavy plugin repo - not installed here.
    "--ignore=pwem/tests/protocols/test_protocol_alignment_assign.py",
    "--ignore=pwem/tests/protocols/test_protocol_invert_Hand.py",
    "--ignore=pwem/tests/protocols/test_protocols_assign_orig.py",
    # Hardcodes network downloads bypassing SCIPION_TEST_NOSYNC and needs
    # real Xmipp metadata parsing on the result.
    "--ignore=pwem/tests/protocols/test_projection_edit.py",
    # Needs external EM tools (Xmipp/Relion/EMAN2/Chimera/Coot/Refmac) and/or
    # a GPU - not installable in this repo's own lightweight CI.
    "--ignore=pwem/tests/workflows",
    # Live Heroku usage-analytics endpoint, external contract test.
    "--deselect=pwem/tests/protocols/test_notifier.py::NotifierTest::test_projectNotifier",
]
env = [
    "D:SCIPION_HOME={HOME}/.cache/scipion_pwem_test_home",
    "D:SCIPION_DOMAIN=pwem",
    "D:SCIPION_TEST_NOSYNC=1",
]

name: scipion-em tests

on:
  push:
    branches: [ "devel" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: |
          pip install .
          pip install -r requirements-dev.txt
      - run: pip check
      - run: pytest --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-report.xml

  collect-smoke:
    # Import/syntax smoke check across the whole pwem/tests tree, including
    # workflows/ (needs Xmipp/Relion/EMAN2/Chimera/Coot/Refmac + GPU to
    # actually run - not installed here, see the `test` job above for the
    # hermetic subset that does run). Only the 3 files with a hard
    # `from xmipp3 import ...` are excluded, since collection itself needs
    # that plugin installed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: |
          pip install .
          pip install -r requirements-dev.txt
      - run: |
          pytest -o addopts="" pwem/tests --collect-only -q \
            --ignore=pwem/tests/protocols/test_protocol_alignment_assign.py \
            --ignore=pwem/tests/protocols/test_protocol_invert_Hand.py \
            --ignore=pwem/tests/protocols/test_protocols_assign_orig.py
